<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saraschandrika Industries</title>
<meta name="description" content="Saraschandrika Industries Pvt Ltd.">
<meta name="theme-color" content="#4f5256">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --top: #45484c; --bottom: #7d8085; --fg: #ffffff; --soft: #d5d7da; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    min-height: 100vh;
    background: linear-gradient(180deg, var(--top) 0%, var(--bottom) 100%);
    color: var(--fg);
    font-family: Montserrat, "Helvetica Neue", Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  h1 {
    font-weight: 600;
    text-transform: uppercase;
    font-size: min(6.4vw, 64px);
    letter-spacing: 0.2em;
    margin-right: -0.2em; /* keeps the spaced line optically centred */
    line-height: 1.1;
  }
  h2 {
    font-weight: 400;
    text-transform: uppercase;
    font-size: min(2.6vw, 22px);
    letter-spacing: 0.62em;
    margin-right: -0.62em;
    margin-top: 0.9em;
    color: var(--soft);
  }
  .rule {
    width: 56px;
    height: 1px;
    background: rgba(255, 255, 255, 0.55);
    margin: 44px auto 22px;
  }
  p {
    font-size: 12px;
    font-weight: 400;
    letter-spacing: 0.4em;
    margin-right: -0.4em;
    text-transform: uppercase;
    color: var(--soft);
  }
  @media (max-width: 600px) {
    h2 { font-size: 11px; letter-spacing: 0.5em; margin-right: -0.5em; }
    .rule { margin: 32px auto 18px; }
    p { font-size: 10px; }
  }
</style>
</head>
<body>
  <h1>Saraschandrika</h1>
  <h2>Industries</h2>
  <div class="rule"></div>
  <p>Coming soon</p>
</body>
</html>
