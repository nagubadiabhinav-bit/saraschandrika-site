<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saraschandrika Industries</title>
<meta name="description" content="Saraschandrika Industries.">
<meta name="theme-color" content="#16181d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600&family=Syncopate:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #16181d;     /* charcoal: header and headline */
    --ivory: #f3efe7;   /* warm ivory page */
    --brass: #9c7c4c;   /* muted brass accent */
    --mute: #7a7468;    /* warm grey for small text */
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--ivory);
    color: var(--ink);
    font-family: Montserrat, "Helvetica Neue", Arial, sans-serif;
  }
  header {
    background: var(--ink);
    color: var(--ivory);
    padding: 22px 6vw;
    font-weight: 600;
    font-size: 12px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
  }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 8vh 6vw;
  }
  h1 {
    font-family: Syncopate, "Arial Black", sans-serif;
    font-weight: 700;
    text-transform: uppercase;
    font-size: min(6.6vw, 84px);
    line-height: 1.18;
    letter-spacing: 0.02em;
  }
  h1 span { display: block; }
  .soon {
    margin-top: 44px;
    font-weight: 600;
    font-size: 12px;
    letter-spacing: 0.42em;
    margin-right: -0.42em; /* keeps the spaced line optically centred */
    text-transform: uppercase;
    color: var(--brass);
  }
  footer {
    padding: 22px 6vw;
    text-align: center;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.08em;
    color: var(--mute);
  }
  @media (max-width: 700px) {
    header { padding: 20px 24px; }
    main { padding: 40px 24px; }
    h1 { font-size: calc((100vw - 48px) / 12.6); }
    .soon { margin-top: 28px; font-size: 11px; }
  }
</style>
</head>
<body>
  <header>Saraschandrika</header>
  <main>
    <h1><span>Saraschandrika</span><span>Industries</span></h1>
    <p class="soon">Coming soon</p>
  </main>
  <footer>&copy; 2026 Saraschandrika Industries</footer>
</body>
</html>
