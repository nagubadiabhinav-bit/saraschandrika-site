<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saraschandrika Industries</title>
<meta name="description" content="Saraschandrika Industries Pvt Ltd.">
<meta name="theme-color" content="#ebeae4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono&display=swap" rel="stylesheet">
<style>
  :root { --bg: #ebeae4; --fg: #1c1d1c; --mute: #6f706b; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 6vw 5vw;
    overflow-x: hidden;
  }
  h1 {
    font-family: Anton, "Bebas Neue", Impact, "Arial Narrow", sans-serif;
    font-weight: 400;
    text-transform: uppercase;
    line-height: 0.86;
    letter-spacing: -0.01em;
    font-size: 13.4vw;
  }
  h1 span { display: block; white-space: nowrap; width: max-content; }
  p {
    margin-top: 4vw;
    font-family: "Space Mono", ui-monospace, monospace;
    font-size: clamp(11px, 1.1vw, 14px);
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--mute);
  }
  @media (max-width: 600px) {
    h1 { font-size: 14.2vw; }
    p { margin-top: 28px; }
  }
</style>
</head>
<body>
  <h1><span>Saraschandrika</span><span>Industries</span></h1>
  <p>Coming soon</p>
<script>
  // Size the headline so the longer line fills the page width exactly, whatever the screen.
  function fit() {
    var h = document.querySelector('h1');
    var first = h.querySelector('span');
    h.style.fontSize = '100px';
    h.style.fontSize = (100 * h.clientWidth / first.scrollWidth) + 'px';
  }
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(fit);
  window.addEventListener('resize', fit);
</script>
</body>
</html>
