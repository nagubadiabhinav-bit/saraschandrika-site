<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saraschandrika Industries</title>
<meta name="description" content="Saraschandrika Industries Pvt Ltd. Ferrous castings, Zaheerabad, Telangana.">
<style>
  :root { --bg: #f7f6f3; --fg: #1a1a1a; --mute: #6b6b6b; --accent: #c2410c; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111; --fg: #eee; --mute: #999; --accent: #f97316; } }
  * { margin: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: Georgia, "Times New Roman", serif;
    display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 24px;
  }
  h1 { font-weight: 400; font-size: clamp(28px, 6vw, 52px); letter-spacing: 0.02em; }
  .line { width: 48px; height: 2px; background: var(--accent); margin: 22px auto; }
  p { color: var(--mute); font-family: system-ui, sans-serif; font-size: 15px; letter-spacing: 0.08em; text-transform: uppercase; }
</style>
</head>
<body>
  <main>
    <h1>Saraschandrika Industries</h1>
    <div class="line"></div>
    <p>Coming soon</p>
  </main>
</body>
</html>
