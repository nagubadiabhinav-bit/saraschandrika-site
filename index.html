<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saraschandrika Industries</title>
<meta name="description" content="Saraschandrika Industries Pvt Ltd.">
<meta name="theme-color" content="#1b2550">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;900&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #1b2550;      /* primary: deep ink navy, trust */
    --steel: #5a6a8c;     /* secondary: steel blue */
    --paper: #f5f3ef;     /* warm off-white page */
    --copper: #c4612d;    /* accent: copper, sets the brand apart from plain corporate blue */
    --mute: #6b7085;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--paper);
    color: var(--navy);
    font-family: Montserrat, "Helvetica Neue", Arial, sans-serif;
  }
  header {
    background: linear-gradient(90deg, var(--navy), #2c3a72);
    color: #fff;
    padding: 22px 6vw;
    font-weight: 600;
    font-size: 12px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
  }
  main {
    flex: 1;
    display: grid;
    grid-template-columns: 1.15fr 1fr;
    align-items: center;
    gap: 5vw;
    padding: 6vw;
  }
  h1 {
    font-weight: 900;
    font-size: clamp(44px, 7vw, 112px);
    line-height: 0.98;
    letter-spacing: -0.02em;
  }
  .soon {
    display: inline-block;
    margin-top: 36px;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--copper);
  }
  /* abstract panel: navy-to-steel card with soft concentric arcs and a copper glow */
  .panel {
    aspect-ratio: 4 / 3.4;
    border-radius: 28px;
    background:
      radial-gradient(circle at 78% 82%, rgba(196, 97, 45, 0.55), transparent 38%),
      repeating-radial-gradient(circle at 78% 82%, rgba(255, 255, 255, 0.07) 0 1px, transparent 1px 34px),
      linear-gradient(150deg, var(--navy) 0%, #2c3a72 55%, var(--steel) 100%);
    box-shadow: 0 30px 60px -30px rgba(27, 37, 80, 0.55);
  }
  footer {
    padding: 22px 6vw;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.06em;
    color: var(--mute);
  }
  @media (max-width: 820px) {
    main { grid-template-columns: 1fr; align-content: center; padding: 40px 24px; gap: 40px; }
    h1 { font-size: min(calc((100vw - 48px) / 10.4), 72px); }
    .soon { margin-top: 24px; }
    .panel { aspect-ratio: 16 / 10; border-radius: 22px; }
    header, footer { padding-left: 24px; padding-right: 24px; }
  }
</style>
</head>
<body>
  <header>Saraschandrika</header>
  <main>
    <div>
      <h1>Saraschandrika Industries</h1>
      <span class="soon">Coming soon</span>
    </div>
    <div class="panel" aria-hidden="true"></div>
  </main>
  <footer>&copy; 2026 Saraschandrika Industries Pvt Ltd</footer>
</body>
</html>
